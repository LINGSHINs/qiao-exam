/* ---------- 统计页 ---------- */
function renderStats(){
  var done=Object.keys(S.doneOnce).length;
  var right=0,wrong=0;
  var perSec={}, perType={'单选题':[0,0],'多选题':[0,0],'判断题':[0,0]};
  Object.keys(S.stats).forEach(function(k){
    var st=S.stats[k]; right+=st.r||0; wrong+=st.w||0;
    var q=BANK[k]; if(!q) return;
    perSec[q.sec]=perSec[q.sec]||[0,0,0];
    perSec[q.sec][0]+=st.r||0; perSec[q.sec][1]+=st.w||0;
    perType[q.type][0]+=st.r||0; perType[q.type][1]+=st.w||0;
  });
  // 各章节已刷
  var secDone={}; Object.keys(S.doneOnce).forEach(function(k){ var q=BANK[k]; if(q){ secDone[q.sec]=(secDone[q.sec]||0)+1; }});
  var secTotal={}; BANK.forEach(function(q){ secTotal[q.sec]=(secTotal[q.sec]||0)+1; });
  var html='<h3 style="margin-bottom:14px">学习进度</h3>';
  html+='<div class="statgrid">'+statCells([[BANK.length,'题库'],[done,'已刷'],[fmtPct(right,right+wrong),'总正确率'],[S.wrong.length,'错题']])+'</div>';
  Object.keys(secTotal).forEach(function(s){
    var d=secDone[s]||0, pct=Math.round(d/secTotal[s]*100);
    html+='<div class="progwrap"><div class="progbar"><i style="width:'+pct+'%"></i></div><div class="secline"><span>'+s+'</span><span>'+d+' / '+secTotal[s]+' · '+pct+'%</span></div></div>';
  });
  html+='<h3 style="margin:20px 0 10px">分题型正确率</h3>';
  Object.keys(perType).forEach(function(t){
    var r=perType[t][0], w=perType[t][1];
    html+='<div class="progwrap"><div class="progbar"><i style="width:'+(r+w? Math.round(r/(r+w)*100):0)+'%"></i></div><div class="secline"><span>'+TYPEMAP[t]+'</span><span>'+fmtPct(r,r+w)+'</span></div></div>';
  });
  document.getElementById('statsBody').innerHTML=html;
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  // 模式入口
  if(t.dataset.go){
    var g=t.dataset.go;
    if(g==='wrong'){ renderWrong(); show('vWrong'); return; }
    if(g==='stats'){ renderStats(); show('vStats'); return; }
    if(g==='settings'){  show('vSettings'); return; }
    openConf(g); return;
  }
  // 主题
  if(t.dataset.th){ applyTheme(t.dataset.th); return; }
  // 导航
  if(t.dataset.nav){
    var n=t.dataset.nav;
    if(n==='home'){ try{localStorage.removeItem('quizSession');}catch(e){} renderHome(); show('vHome'); }
    else if(n==='wrong'){ renderWrong(); show('vWrong'); }
    else if(n==='stats'){ renderStats(); show('vStats'); }
    else if(n==='settings'){  show('vSettings'); }
    return;
  }
  // 章节题型chips
  if(t.dataset.sec){ t.classList.toggle('on'); confSel.sec[t.dataset.sec]=t.classList.contains('on')?1:0; return; }
  if(t.dataset.type){ t.classList.toggle('on'); confSel.type[t.dataset.type]=t.classList.contains('on')?1:0; return; }
  if(t.dataset.t!==undefined && t.closest('#confTime')){ confTime=+t.dataset.t; document.querySelectorAll('#confTime .chip').forEach(function(c){c.classList.remove('on');}); t.classList.add('on'); return; }
  if(t.dataset.gap!==undefined && t.closest('#confGap')){ confGap=+t.dataset.gap; document.querySelectorAll('#confGap .chip').forEach(function(c){c.classList.remove('on');}); t.classList.add('on'); return; }
  if(t.dataset.streak!==undefined && t.closest('#confStreak')){ confStreak=+t.dataset.streak; document.querySelectorAll('#confStreak .chip').forEach(function(c){c.classList.remove('on');}); t.classList.add('on'); return; }
  // 选项
  if(t.classList.contains('opt') && t.dataset.o!==undefined){ pickOpt(+t.dataset.o); return; }
  // 答题卡格子
  if(t.classList.contains('acell') && t.dataset.i!==undefined){ Quiz.i=+t.dataset.i; renderQ(); return; }
});
document.getElementById('btnBack').addEventListener('click',function(){
  if(curView==='vAnsSheet'){ show('vQuiz'); }
  else if(curView==='vQuiz'){ if(confirm('结束当前练习？')) finishQuiz(); }
  else if(curView==='vConf'){ renderHome(); show('vHome'); }
  else { renderHome(); show('vHome'); }
});
document.getElementById('qCardBtn').addEventListener('click',renderAnsSheet);
document.getElementById('qSubmit').addEventListener('click',function(){
  var q=curQ(); if(!q) return;
  var a=Quiz.ans[Quiz.i];
  if(!a||!a.length){ return; }
  if(q.type==='多选题'){ judgeMulti(); return; }
  var right=q.ans[0]===a[0];
  recAnswer(q,right); recordRound(right);
  renderQ();
});
document.getElementById('qNext').addEventListener('click',nextQ);
document.getElementById('qPrev').addEventListener('click',prevQ);
document.getElementById('qFinish').addEventListener('click',function(){ if(confirm('确定结束本次练习？')) finishQuiz(); });
document.getElementById('confStart').addEventListener('click',startConf);
document.getElementById('rHome').addEventListener('click',function(){ renderHome(); show('vHome'); });
document.getElementById('rAgain').addEventListener('click',function(){ openConf(Quiz.mode); });
document.getElementById('wClear').addEventListener('click',function(){
  if(confirm('确定清空错题集？')){ S.wrong=[]; lsSet('wrong',S.wrong); renderWrong(); }
});
document.getElementById('wDrill').addEventListener('click',function(){
  if(!S.wrong.length) return;
  var list=S.wrong.slice();
  var opt={mode:'forget',instant:true,auto:S.auto,timer:0};
  list.forEach(function(idx){ delete BANK[idx].__order; });
  buildQuiz(list,opt); renderQ();
});
document.getElementById('btnReset').addEventListener('click',function(){
  if(confirm('将清空所有学习记录与错题，确定？')){
    S.stats={}; S.wrong=[]; S.doneOnce={};
    lsSet('stats',S.stats); lsSet('wrong',S.wrong); lsSet('doneOnce',S.doneOnce);
    renderHome(); alert('已重置');
  }
});
// 开关
bindSw('swInstant','instant'); bindSw('swInstant2','instant');
bindSw('swAuto','auto'); bindSw('swAuto2','auto');
bindSw('swReciteAuto','reciteAuto');
bindSw('swSound','sound');
bindSw('swFx','fx');
bindSw('swQshuf','qshuf'); bindSw('swOshuf','oshuf');
// 自动跳转延时chips
(function(){
  var el=document.getElementById('autoDelayChips');
  el.innerHTML=[1,2,3,5,8].map(function(s){ return '<button class="chip" data-ad="'+s+'">'+s+'秒</button>'; }).join('');
  el.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    S.autoDelay=+t.dataset.ad; lsSet('autoDelay',S.autoDelay);
    el.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', +c.dataset.ad===S.autoDelay); });
  });
  el.querySelector('[data-ad="'+S.autoDelay+'"]').classList.add('on');
})();
// 设置页同步两个instant开关
['swInstant','swInstant2'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(){ setSw('swInstant',S.instant); setSw('swInstant2',S.instant); });
});
['swAuto','swAuto2'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(){ setSw('swAuto',S.auto); setSw('swAuto2',S.auto); });
});


/* ---------- 振动反馈 ---------- */
function buzz(right){
  try{ if(navigator.vibrate) navigator.vibrate(right? 30 : [80,40,80]); }catch(e){}
}

/* ---------- PWA: 动态icon+manifest ---------- */
function initPWA(){
  try{
    var c=document.createElement('canvas'); c.width=512; c.height=512;
    var x=c.getContext('2d');
    x.fillStyle='#101418'; x.fillRect(0,0,512,512);
    x.fillStyle='#8fae8b';
    x.font='bold 300px -apple-system, "PingFang SC", sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText('考',256,266);
    var icon=c.toDataURL('image/png');
    var li=document.getElementById('appleIcon'); if(li) li.href=icon;
    var man={
      name:'外汇考试', short_name:'外汇考试',
      start_url: location.pathname+location.search,
      display:'standalone', background_color:'#101418', theme_color:'#101418',
      icons:[{src:icon,sizes:'512x512',type:'image/png'}]
    };
    var ml=document.getElementById('manifestLink');
    if(ml) ml.href='data:application/manifest+json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(man))));
  }catch(e){}
}

/* ---------- init ---------- */
initPWA();
applyTheme(S.theme);

/* 会话恢复: 退出PWA再进, 继续刚才的题 */
setTimeout(function(){
  var restored=false;
  try{ restored=restoreSession(); }catch(e){}
  if(restored){ show('vQuiz'); renderQ(); }
},50);
setSw('swInstant',S.instant); setSw('swInstant2',S.instant);
setSw('swAuto',S.auto); setSw('swAuto2',S.auto);
setSw('swReciteAuto',S.reciteAuto); setSw('swSound',S.sound); setSw('swFx',S.fx);
if(S.fx===false) document.documentElement.style.setProperty('--shadow','none');

renderHome();
show('vHome');
</script>
