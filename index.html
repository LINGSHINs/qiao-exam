<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="外汇考试">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<title>外汇考试</title>
<style>
:root{
  --bg:#0f1318; --bg2:#161c23; --card:#1c232c; --card2:#232c37;
  --tx:#e8edf2; --tx2:#9aa7b4; --tx3:#5f6b78;
  --ac:#5ea0d8; --ac2:#7fb8e6; --ok:#5fbf8a; --bad:#d87070;
  --line:#2a333e; --shadow:0 4px 24px rgba(0,0,0,.35);
  --r:16px; --nav-h:64px; --radius:14px; --card-rad:16px; --letter:0; --fw:600;
  --bg:#fbfafa; --bg2:#f3f1f1; --card:#ffffff; --card2:#f8f5f5;
  --tx:#2a2626; --tx2:#6b6060; --tx3:#a89898; --ac:#d63a2e; --ac2:#e8645a;
  --ok:#2f9e4e; --bad:#c8443a; --line:#eae2e2; --shadow:0 4px 20px rgba(160,40,30,.08);
}








*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;-webkit-touch-callout:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:auto}
body{background:var(--bg);color:var(--tx);letter-spacing:var(--letter);font-weight:var(--fw);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-top:constant(safe-area-inset-top);padding-top:env(safe-area-inset-top);
  font-size:16px;line-height:1.65;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));transition:background .3s}
.app{max-width:680px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-weight:600;letter-spacing:.02em}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select{font-family:inherit}
.errbox{display:none;position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#a33;color:#fff;font-size:12px;padding:6px 12px;z-index:999;word-break:break-all}

/* 顶栏 */
.topbar{position:sticky;top:env(safe-area-inset-top);z-index:50;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:680px;margin:0 auto;padding:calc(14px + constant(safe-area-inset-top)) 18px 10px;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:700;letter-spacing:.12em}
.brand small{display:block;font-size:10px;color:var(--tx3);letter-spacing:.3em;font-weight:400;margin-top:1px}
.icobtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.2s}
.icobtn:active{background:var(--card2)}
.icobtn svg{width:21px;height:21px}

/* 卡片 */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.view{display:none;animation:fadein .25s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 首页模式宫格 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 14px;text-align:left;transition:.15s;position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}
.mode .mi{width:34px;height:34px;margin-bottom:10px;color:var(--ac)}
.mode .mi svg{width:100%;height:100%}
.mode b{font-size:16px;display:block;margin-bottom:3px}
.mode span{font-size:12px;color:var(--tx2);line-height:1.4;display:block}
.greet{padding:26px 4px 18px}
.greet h2{font-size:24px;letter-spacing:.04em}
.greet p{color:var(--tx2);font-size:13px;margin-top:4px}

/* 进度可视化 */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg2);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{font-size:20px;display:block;color:var(--ac)}
.stat span{font-size:11px;color:var(--tx2)}
.progwrap{margin-top:14px}
.progbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .5s ease}
.secline{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:6px}

/* 表单控件 */
.sel,input[type=number]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  border-radius:12px;padding:12px 14px;font-size:15px;appearance:none;-webkit-appearance:none}
.sel:focus,input:focus{outline:none;border-color:var(--ac)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;letter-spacing:.05em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--line);font-size:14px;color:var(--tx2);transition:.15s}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.chip:active{transform:scale(.95)}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.switchrow:last-child{border-bottom:none}
.switchrow .sl b{font-size:15px;display:block}
.switchrow .sl span{font-size:12px;color:var(--tx2)}
.sw{width:46px;height:27px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--tx3);transition:.2s}
.sw.on{background:var(--ac);border-color:var(--ac)}
.sw.on i{left:21px;background:#fff}
.btn.disabled,.btn:disabled{opacity:.45;pointer-events:none;}
.btn{display:block;width:100%;padding:15px;border-radius:var(--radius);background:var(--ac);color:var(--bg);
  font-size:16px;font-weight:600;text-align:center;transition:.15s;letter-spacing:.04em}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.ghost{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

/* 答题页 */
.qtop{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;font-size:13px;color:var(--tx2)}
.qtop .qno{font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow)}
.qtype{display:inline-block;font-size:11px;color:var(--ac2);border:1px solid var(--ac);border-radius:6px;padding:1px 8px;margin-bottom:12px;letter-spacing:.1em}
.qtext{font-size:17px;font-weight:500;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;transition:.15s;text-align:left;width:100%}
.opt:active{transform:scale(.985)}
.opt .ol{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tx3);display:flex;align-items:center;
  justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;transition:.15s}
.opt .ot{font-size:15px;word-break:break-word}
.opt.sel{border-color:var(--ac);background:rgba(110,150,190,.16);background:color-mix(in srgb,var(--ac) 12%,var(--bg2))}
.opt.sel .ol{border-color:var(--ac);background:var(--ac);color:var(--bg)}
.opt.right{border-color:var(--ok);background:rgba(95,170,120,.18);background:color-mix(in srgb,var(--ok) 14%,var(--bg2))}
.opt.right .ol{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(200,100,100,.16);background:color-mix(in srgb,var(--bad) 12%,var(--bg2))}
.opt.wrong .ol{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.exp{margin-top:14px;padding:12px 14px;background:var(--bg2);border-radius:12px;font-size:13.5px;color:var(--tx2);display:none;white-space:pre-wrap}
.exp.show{display:block}
.exp b{color:var(--ac2);display:block;margin-bottom:4px;font-size:12px;letter-spacing:.1em}
.qactions{display:flex;gap:10px;margin-top:16px}
.qactions .btn{padding:13px}
.qnav{display:flex;justify-content:space-between;align-items:center;padding:14px 2px}
.qnav button{color:var(--tx2);font-size:14px;padding:10px 16px;border-radius:12px}
.qnav button:active{background:var(--card)}
.feedback{margin-top:12px;font-size:14px;font-weight:600;height:22px;line-height:22px;overflow:hidden;visibility:hidden;color:transparent;white-space:nowrap}
.feedback.show{visibility:visible;color:inherit}
.feedback.ok.show{color:var(--ok)}
.feedback.bad.show{color:var(--bad)}
.feedback.ok{display:block;color:var(--ok)}
.feedback.bad{display:block;color:var(--bad)}

/* 答题卡 */
.grid-ans{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.acell{height:38px;max-height:38px;aspect-ratio:1;border-radius:9px;background:var(--bg2);border:1px solid var(--line);
  font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.12s}
.acell:active{transform:scale(.9)}
.acell.done{background:rgba(110,150,190,.28);background:color-mix(in srgb,var(--ac) 22%,var(--bg2));color:var(--tx);border-color:var(--ac)}
.acell.right{background:rgba(95,170,120,.34);background:color-mix(in srgb,var(--ok) 30%,var(--bg2));border-color:var(--ok);color:var(--tx)}
.acell.wrong{background:rgba(200,100,100,.34);background:color-mix(in srgb,var(--bad) 30%,var(--bg2));border-color:var(--bad);color:var(--tx)}
.acell.cur{outline:2px solid var(--ac);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 错题集/统计 */
.wrongitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;font-size:14px}
.wrongitem .wt{color:var(--bad);font-size:11px;letter-spacing:.1em;margin-bottom:5px}
.qstat{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:8px}
.empty{ text-align:center;color:var(--tx3);padding:50px 0;font-size:14px}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.4}

/* 底部导航 */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:row;flex-wrap:nowrap;height:var(--nav-h);justify-content:space-around}
.nav-in button{flex:1 1 25%;width:25%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--tx3);font-size:11px;transition:.2s}
.nav-in button.on{color:var(--ac)}
.nav-in svg{width:22px;height:22px;flex-shrink:0}

/* 抽屉设置 */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.on{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:.25s}
.drawer.on .mask{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-radius:22px 22px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.28s cubic-bezier(.3,.9,.3,1);max-height:82vh;overflow-y:auto}
.drawer.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:16px;margin-bottom:12px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.thcard{border:2px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;transition:.15s}
.thcard.on{border-color:var(--ac)}
.thcard .dot{width:100%;height:34px;border-radius:9px;margin-bottom:7px;border:1px solid rgba(128,128,128,.2)}
.thcard span{font-size:12px;color:var(--tx2)}

/* 答题页顶部进度 */
.tinybar{height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;flex:1;margin:0 12px}
.tinybar i{display:block;height:100%;background:var(--ac);transition:width .3s}

/* 倒计时环 */
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tx2);min-width:34px;text-align:right}
.timer.low{color:var(--bad)}

/* 成绩页 */
.score-big{text-align:center;padding:26px 0 10px}
.score-big b{font-size:52px;font-weight:200;letter-spacing:-.02em}
.score-big b small{font-size:20px;color:var(--tx3)}
.score-big p{color:var(--tx2);font-size:13px;margin-top:2px}
.ring{width:120px;height:120px;margin:0 auto 8px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:300}

@media (min-width:700px){ .modes{grid-template-columns:repeat(3,1fr)} .grid-ans{grid-template-columns:repeat(10,1fr)} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="errbox" id="errbox"></div>

<header class="topbar" id="topbar" style="display:none">
  <div class="topbar-in">
    <button class="icobtn" id="btnBack" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="text-align:center;flex:1">
      <div class="brand" id="topTitle" style="font-size:17px;letter-spacing:.15em">外汇考试</div>
    </div>
    <button id="qFinish" style="border:none;background:none;color:var(--tx2);font-size:13px;padding:8px 4px;cursor:pointer;white-space:nowrap">结束</button>
  </div>
  <div style="padding:0 18px 8px;display:flex;align-items:center;gap:8px"><div class="tinybar" style="position:relative;flex:1">
  <i id="tinyFill" style="width:0"></i>
  <span id="tinyPct" style="position:absolute;top:-14px;left:0;transform:translateX(-50%);font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums;transition:left .5s ease;white-space:nowrap">0%</span>
</div><span id="tinyLbl" style="font-size:11px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums"></span></div>
</header>

<main class="app" id="main">

<!-- 首页 -->
<section class="view on" id="vHome">
  <div class="greet">
    <h2>外汇考试</h2>
    <p>国际业务 · 题海摆渡</p>
  </div>
  <div class="card">
    <div class="statgrid" id="homeStats"></div>
    <div class="progwrap">
      <div class="progbar"><i id="homeProg" style="width:0"></i></div>
      <div class="secline"><span id="homeProgLbl">总进度</span><span id="homeProgPct">0%</span></div>
    </div>
  </div>
  <div class="modes">
    <button class="mode" data-go="seq"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div><b>顺序刷题</b><span>从头至尾，步步为营</span></button>
    <button class="mode" data-go="paper"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8a2 2 0 012 2v14a2 2 0 01-2 2H8a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div><b>组卷刷题</b><span>自选范围，模拟实战</span></button>
    <button class="mode" data-go="forget"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-7 6 7 9 0s6 7 9 0"/></svg></div><b>遗忘曲线</b><span>科学复习，克错为友</span></button>
    <button class="mode" data-go="loop"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg></div><b>循环刷题</b><span>区间循环，错题重现</span></button>
    <button class="mode" data-go="recite"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6s2-2 5-2 5 2 5 2v14s-2-2-5-2-5 2-5 2V6z"/><path d="M22 6s-2-2-5-2-5 2-5 2v14s2-2 5-2 5 2 5 2V6z"/></svg></div><b>背题模式</b><span>直面答案，静心记忆</span></button>
    <button class="mode" data-go="quick"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div><b>快答模式</b><span>限时作答，电光石火</span></button>
    <button class="mode" data-go="wrong"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div><b>错题集</b><span>拾遗补缺，逐个击破</span></button>
    <button class="mode" data-go="stats"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></div><b>学习进度</b><span>正确率与进度一览</span></button>
    <button class="mode" data-go="settings"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6h0a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div><b>设置</b><span>答题偏好设置</span></button>
  </div>
</section>

<!-- 配置页(顺序/组卷/循环/快答等共用) -->
<section class="view" id="vConf">
  <div class="card">
    <div class="field"><label>章节</label><div class="chips" id="confSec"></div></div>
    <div class="field"><label>题型</label><div class="chips" id="confType"></div></div>
    <div class="field" id="confCountF"><label>题量</label><input type="number" id="confCount" class="sel" inputmode="numeric" placeholder="全部"></div>
    <div class="field" id="confRangeF" style="display:none"><label>题号区间（循环刷题）</label>

采购贸易,可通过个人外汇账户办理符合相关要求的市场采购贸易外汇结算。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"外币现钞结汇金额达到规定入境申报金额的,银行还应审核企业提交的经海关签章的《中华人民共和国海关进境旅客行李物品申报单》(正本)。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"办理单笔等值5万美元以上的服务贸易对外支付,银行应按照服务贸易对外支付税务备案有关规定核验服务贸易等项目对外支付纸质或电子税务备案表。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"为贸易新业态提供服务的银行和支付机构,按照展业原则,应完善贸易新业态客户身份识别和管理制度,加强客户信用分类管理,持续开展客户身份识别与交易抽查验证,健全客户合规约束和分类标识机制,放宽办理重点名单内市场主体的外汇业务要求,指导客户合规办理外汇收支。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"以人民币购买外币旅行支票的,按照个人购汇的相关规定办理。以外汇账户资金购买的,无论金额大小,凭本人有效身份证件可直接办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"注册地外汇分局应在支付机构提交合格完整申请材料之日起30个工作日内,为获准登记的支付机构出具正式书面文件,为其办理名录登记,并按规定公开许可结果,同时报备国家外汇管理局。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"经常项目资金集中收付,是指主办企业通过国内资金主账户集中代理境内成员企业办理经常项目收支。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境外机构人民币银行结算账户可接收从境外同名账户汇入的人民币资金。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境外机构只能在境内银行业金融机构开立境外机构人民币银行结算账户存放发行人民币债券所募集的资金及办理相关跨境人民币结算业务。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"境内个人办理跨境电子商务项下结售汇,提供有交易额的材料或交易电子信息的,不占用个人年度便利化额度。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"个人不占用年度便利化额度的外币现钞结汇,当日外币现钞结汇累计金额超过等值1万美元,凭本人有效身份证件和有交易额的相关材料在银行办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"在个人系统出现全国性系统故障时,国家外汇管理局将通过国家外汇管理局应用服务平台发布信息,启动应急业务办理方案。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"出口贸易融资业务项下资金,在金融机构放款及企业实际收回出口货款时,须划入企业国内外汇贷款账户后再办理资金结汇及使用。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"结算银行可以为跨境双向人民币资金池人民币专用存款账户办理日间及隔夜透支。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"被实施“关注名单”管理的个人,首次在柜台办理个人外汇业务时,银行应口头告知客户。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"在企业出口确实无法按期收汇且没有其他外汇资金可用于偿还出口押汇等具有出口背景的国内外汇贷款时,贷款银行可按照展业原则,审慎为企业办理购汇偿还手续,无需向所在地外汇局报告。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"银行对个人购汇后即办理付汇的业务,应进行购付汇用途一致性审核。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"进口项下退汇的境外付款人应为原付款人、境内收款人应当为原收款人。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"跨境电子商务企业出口至海外仓销售的货物,汇回的实际销售收入可与相应货物的出口报关金额不一致。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境外机构或个人因临时使用境内港口等交通设施所支付的服务或补给物品费用,境内机构可收取外币现钞,但应在银行办理结汇。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境内机构应在每月初10个工作日内如实向所在地外汇局报告境外账户收支余信息。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"债务人应以货物贸易出口收汇资金偿还出口贸易融资(含已结汇使用的具有货物贸易出口背景的境内外汇贷款),原则上可以购汇偿还。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"在关注期限内,“关注名单”内个人无法再办理个人结售汇业务。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"对于境内个人留学期间在同一银行再次办理不占年度便利化额度的留学学费购付汇，银行可根据首次办理情况，免于审核重复性材料，购汇资金直接汇入原学校账户。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"外汇局对货物贸易外汇收支企业分类结果进行动态调整，B、C 类企业的分类监管有效期原则上为一年。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境内个人办理跨境电子商务项下结售汇，提供有交易额的材料或交易电子信息的，不占用个人年度便利化额度。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"个人凭本人有效身份证件及旅行支票办理外币旅行支票兑付的，应按照个人结汇的相关规定办理。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"具有货物贸易出口背景的境内外汇贷款，可由债务人自行选择按支付结汇或意愿结汇方式办理结汇手续，除此以外的其他境内外汇贷款不允许结汇。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境外个人在境内银行办理当日累计兑换不超过等值1000美元（含）的人民币兑回外汇的，可凭本人有效身份证件办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"使用人民币结算的出口贸易，不享受出口货物退（免）税政策。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"企业向所在地外汇局报告辅导期内业务的要求已取消。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"对于个人真实、合法的经常项目项下用汇需求，银行应坚持“实质重于形式”的审核原则。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"内保外贷项下担保责任为境外机构衍生交易项下支付义务时，境外债务人从事衍生交易应以止损保值为目的，符合其主营业务范围且经过适当授权。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"银行办理经常项目外汇收支，应按规定留存审核后的纸质或电子材料3年备查。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"跨境电子商务是指通过物联网等信息网络从事商品或者服务贸易进出口的经营活动。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"持有中华人民共和国护照的个人须同时凭境外永久居留证才能办理结售汇等业务，并按境外个人进行管理。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"已部分使用、但未到期的登记表可以作废。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"进口项下退汇的境外付款人应当为原收款人、境内收款人应当为原付款人。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"金融机构在办理B类企业付汇、开证、出口贸易融资放款或待核查账户资金结汇或划出手续时，应当进行电子数据核查，通过监测系统扣减其对应的可收付汇额度。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"外汇局对C类企业部分贸易外汇收入业务实行事前逐笔登记管理。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"A类企业货物贸易外汇收入不需要进入出口待核查账户。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"B、C类企业30天以内的预收货款或预付货款，不必在收款或付款之日起30天内，通过监测系统企业端向外汇局报告相应的预计出口或进口日期等信息。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"企业办理货物贸易外汇收入时，银行应确认资金性质，无法确认的及时与企业核实。企业办理货物贸易外汇支出时，银行应确认交易单证所列的交易主体、金额、性质等要素与其申请办理的外汇业务相一致。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"经常项目外汇收入，不能保留或者卖给经营结汇、售汇业务的金融机构。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"具有真实货物贸易外汇收支业务需求的企业凭《贸易外汇收支企业名录登记申请表》、营业执照向所在地外汇局申请名录登记。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"金融机构按规定审核相关单证后，不必在单证正本上签注收付汇金额、日期并加盖业务印章，并留存相关单证正本或复印件备查。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"企业提交的电子单证无法证明交易真实合法或与其申请办理的外汇收支不一致的，银行应要求企业提交原始交易单证及其他相关材料。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"收入存放境外应具备2个条件：一是货物出口收入或服务贸易外汇收入来源真实合法，二是在境外有符合相关规定的支付需求。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"关于服务贸易等项目对外支付税务备案，境内机构和个人对同一笔合同需要多次对外支付的，每次付汇前均需办理税务备案。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"企业应按照“谁出口谁收汇、谁进口谁付汇”原则办理货物贸易外汇收支业务，海关管理法规另有规定的除外。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"企业货物贸易外汇收入可先进入出口收入待核查账户，也可进入企业经常项目外汇结算账户或结汇。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"企业可根据其真实合法的进口付汇需求提前购汇存入其经常项目外汇账户。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"贸易外汇收支便利化试点银行为试点企业办理试点业务的涉外收付款申报时，应在交易附言应注明“贸易便利试点”字样。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"具有关联关系的境内外机构代垫或分摊服务贸易费用，代垫或分摊期限可以超过12个月。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"分次办理的服务贸易外汇收支业务，金融机构每次应在审查后的交易单证上注明金额、日期、加盖业务印章。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"服务贸易项下退汇，应按照原汇入或汇出资金交易性质审查并留存规定的交易单证和整个退汇过程的相关说明或证明材料。退汇金额小于等于原汇入或汇出金额，只要收付款双方协商，可不必原路退回。（","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"邮局柜台服务不属于运输服务项下。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"若服务贸易项下需要提前购汇，应在实际支付日期前7个工作日之内办理，且提前购汇应和付汇在同一家银行办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"《服务贸易等项目对外支付税务备案表》本次付汇金额可以小于企业申请支付金额。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"对于海运外汇业务，若关注客户为海运代理企业的，要求其提供运输合同或协议后办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"服务贸易外汇收入可按规定的条件、期限等调回境内，但是不能存放境外。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"办理单笔等值5万美元（含）以下的服务贸易外汇收支业务，银行仍需审核交易单证。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"服务贸易外汇收入，必须办理结汇，不得自行保留。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"对外承包工程签订合同之前服务贸易项下前期费用对外支付，未使用完的外汇资金，可不调回境内。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"办理服务贸易境内外汇划转业务，由收汇方金融机构按以下规定审查并留存交易单证。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"境内机构和境内个人办理服务贸易外汇收支，提交的交易单证与其申请办理的外汇收支不一致的，金融机构不得办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"国家对服务贸易外汇收支不予限制。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境内机构和境内个人应留存每笔服务贸易外汇收支相关交易单证3年备查。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"外汇指定银行或财务公司自身对外融资如境外借款、境外同业拆借、海外代付以及其他债务等项下的利息支付，无需进行税务备案。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"服务贸易外汇收支下，境内机构和境内个人不得以虚构交易骗取资金收付，不得以分拆等方式逃避外汇监管。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境内机构和个人向境外单笔支付等值5万美元以上的运输、旅游、通信建筑安装等服务贸易费用，应向所在地主管国税机关或地税机关进行税务备案。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判 :"允许福建省内银行为台胞在闽合法合规商品房交易相关款项办理跨境人民币收付业务。福建农信开办行社可在“展业三原则”基础上，为台胞办理商品房交易相关的跨境人民币收付款及境内支付业务。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"台资企业在福建开展再投资依法参照外商投资企业境内再投资免登记，外债、境外上市外汇登记由银行直接办理。台资企业在福建开展境内股权再投资时，被投资企业或股权出让方无需办理接收境内再投资登记。符合条件的非金融企业债务人外债签约（变更）登记，以及非金融企业境外上市外汇登记及变更、注销登记由银行直接办理。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"多选题","q":"根据《国家外汇管理局福建省分局跨境贸易高水平开放实施细则》的规定，银行开展便利化业务，应同时具备以下（   ）条件。","opts":["在国家外汇管理局福建省分局辖内试点地区注册经营的银行一级分行或地方性银行总行，以及一级分行归属于厦门市分局的辖内二级分行。","具备真实的便利化业务需求，所推荐的优质企业符合本实施细则规定的条件。","具备完善的便利化业务内控制度，包括但不限于职责分工、业务授权、优质企业客户准入退出、便利化业务实施规范、风险业务清单、统计监测、可疑交易预警与报告、应急管理、内部监督等方面。","配备外汇业务合规专职岗位和熟悉外汇业务政策的从业人员。","外汇业务合规记录良好，近三年银行外汇业务合规与审慎经营评估原则上均在B（含）以上且至少两年为B+（含）以上。银行成立不满三年的，自成立以来外汇业务合规与审慎经营评估原则上均在B+（含）以上。"],"ans":[0,1,2,3,4]},{"sec":"政策部分","type":"多选题","q":"根据《国家外汇管理局福建省分局跨境贸易高水平开放实施细则》的规定，审慎合规银行应基于客户自愿原则，通过充分的展业尽调确定本行优质企业名单。优质企业应具备以下（    ）条件","opts":["企业原则上在审慎合规银行持续办理经常项目外汇收支业务两年以上。\n实施财务集中管理的集团型企业申请成为优质企业，应由一家在福建省分局辖内试点地区注册的成员企业（以下简称主办企业）向审慎合规银行统一申请。主办企业原则上在审慎合规银行持续办理经常项目外汇收支业务两年以上；集团内其他成员企业（含异地成员企业）应纳入集团内部的财务集中管理但可不在审慎合规银行持续办理经常项目外汇收支业务两年以上。","企业诚实守信、合规经营情况良好，资金收付及贸易信贷、贸易融资符合其生产经营实际。","近两年货物贸易外汇管理分类应持续为A类（如为货物贸易外汇收支名录内企业）且未被外汇局处罚。","企业应配备专人对经常项目外汇收支业务进行监督评估，具备自证经常项目外汇收支及交易的真实性、逻辑性和合理性的能力，做到交易留痕。","出于风险防范目的，审慎合规银行规定的其他条件。"],"ans":[0,1,2,3,4]},{"sec":"政策部分","type":"单选题","q":"企业前往银行办理名录相关业务，以下银行的操作中正确的是（）","opts":["A.办理名录登记时，系统提示该企业曾被外汇局因“终止经营或不再从事对外贸易”而注销名录，银行直接拒绝为其办理。","B.企业申请名录信息变更，但由于是在其他银行办理的名录登记，银行拒绝为其办理。","C.企业所属外汇局发生变更，银行应在“数字外管”平台相应模块中向属地外汇局为企业提出变更申请。","D.如企业未登录过“数字外管”平台互联网端账号，但遗忘初始用户名和初始密码，银行确认企业身份后可查询并告知企业初始用户名和初始密码。"],"ans":[3]},{"sec":"政策部分","type":"单选题","q":".某贸易外汇收支名录A类企业申请在银行办理一笔等值20万美元的退汇，且退汇日期与原收款日期间隔200天，下列说法正确的是?（）","opts":["A.银行在确认超期限的真实性和合理性后可直接为企业办理","B.银行不得为该企业办理","C.银行应凭外汇局签发的《贸易外汇业务登记表》办理","D.银行只能为企业办理等值5万美元以下（含）超期限退汇"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"关于贸易新业态业务，下列说法正确的是（ ）","opts":["A. 从事跨境电子商务的企业可将出口货物在境外发生的仓储、物流、税收等费用与出口货款轧差结算，并按规定办理实际收付数据和还原数据申报。","B. 跨境电子商务企业出口至海外仓销售的货物，汇回的实际销售收入应与相应货物的出口报关金额相一致。","C. 银行和支付机构按规定凭交易电子信息办理货物贸易外汇收支业务时，所有小微跨境电商企业必须办理名录登记。","D. 境内国际寄递企业、物流企业、跨境电子商务平台企业，可为客户代垫与跨境电子商务相关的境外仓储、物流、税收等费用，代垫期限原则上不得超过24个月。"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"2025年1月，境内A企业委托B企业为其代理设备进口和付汇。按委托代理合同约定，设备进口后由B企业支付相应款项。但由于B企业经营困难，于同年6月宣布破产。若设备进口后，A企业申请以自身名义付汇，银行应如何处理?（ ）  分值3分","opts":["A.银行可按照展业原则，审核业务的真实性和合理性后为A企业办理付汇业务，并在涉外收支申报交易附言中标注“非报关人+委托方收付汇+XXX（代理方名称）”。","B.银行可按照展业原则，审核业务的真实性和合理性后为A企业办理付汇业务，并在涉外收支申报交易附言中标注“非报关人+XXX（代理方名称）”。","C.银行不得为A企业办理此种业务付汇。","D.银行应根据外汇局签发的《贸易外汇业务登记表》办理。"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"银行在办理进口报关电子信息核验手续时，发现某企业提交的报关单已被另一家银行用于办理付汇，银行应如何处理?（ ）","opts":["A.直接不予办理。","B.向企业了解情况，确认交易真实、合法且评估已被核验报关单属于合理情况后予以办理。","C.凭外汇局开具的《登记表》办理。","D.继续办理该笔付汇，无需额外操作。"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"境内A公司在H银行办理了一笔10万美元的计算机服务费跨境支付，后因故发生2万美元的退汇。以下银行对于税务备案核验记录的处理，正确的是（ ）","opts":["A.删除之前的税务备案核验记录，重新新增一条8万美元的核验记录","B.将核验记录金额直接改为8万美元","C.将核验记录金额直接改为0，再新增一条8万美元的核验记录","D.将核验记录金额直接改为8万美元，同时在备注栏位注明“退款2万美元”。"],"ans":[3]},{"sec":"政策部分","type":"单选题","q":"根据海关特殊监管区域外汇管理相关规定，以下企业间交易不符合管理要求的是（ ）","opts":["A.海关特殊监管区域内企业Y向另一家海关特殊监管区域内企业H支付海运费2万美元","B.海关特殊监管区域内企业Y向另一家海关特殊监管区域内企业H支付仓储服务费5万元人民币","C.海关特殊监管区域外企业Y向海关特殊监管区域内企业H支付技术服务费2万美元","D.海关特殊监管区域外企业Y向海关特殊监管区域内企业H支付维修费5万元人民币"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"资金池主办及成员企业是贸易便利化政策或高水平开放试点的优质企业的，办理跨国公司经常项目资金集中收付和轧差净额结算手续可适用优质企业贸易外汇收支便利化政策或跨境贸易高水平开放试点措施。原则上经常项目轧差净额结算的频率应不少于（ ）","opts":["A.每个季度1次","B.每个自然月1次","C.每周1次","D.每15个自然日1次"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"按照管理原则，经常项目项下的捐赠外汇收支不包括（ ）","opts":["A.境内某寺庙接受境外信徒的无偿赠与","B.境内某企业向境外福利机构支付的火灾援助","C.境内某企业向某境外个人的捐赠","D.县级以上（含）国家机关向境外捐赠支出"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"银行以审核电子单证方式办理货物贸易外汇收支业务，下面表述错误的是（ ）。","opts":["A.电子单证的形式包括系统自动生成的电子单证、纸质单证电子扫描件等","B.银行按照展业原则，自主审慎选择进行电子单证审核的企业，确保收支的真实性、合规性","C.银行应采取必要的技术识别等手段，确认企业提交电子单证的唯一性，避免同一电子单证以及与其相应的纸质单证被重复使用","D.银行应每年定期固定比例抽查企业原始交易单证的真实性及其与相应电子单证的一致性"],"ans":[3]},{"sec":"政策部分","type":"单选题","q":"若名录内企业法定代表人、联系方式、注册地址发生变更，但未按规定在30日内前往银行办理名录变更，对于信息变更超30天的名录变更业务，如何办理? (   )","opts":["A.企业应出具未能及时办理名录信息变更的情况说明，并前往外汇局办理名录变更。","B.银行可直接为企业办理名录变更。","C.银行可在了解并记录企业未能及时办理名录信息变更的原因后，为企业办理名录变更业务，并提示企业今后应及时办理名录变更。","D.企业可自主选择向外汇局或银行申请办理名录信息变更。"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"银行可将以下哪家企业作为贸易外汇收支便利化政策或跨境贸易高水平开放试点的备选企业（ ）。","opts":["A.企业长期开展国际贸易且以外币结算。","B.企业全部货款以跨境人民币结算，希望参与便利化业务。","C.企业已办理“贸易外汇收支企业名录”登记，上一年度货物贸易外汇管理分类为B类，现已恢复A类。","D.企业长期以美元结算，计划未来将全部贸易结算转为跨境人民币结算。"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"境内A公司向境外B公司出口货物，双方长期合作。2025年12月，A公司为B公司垫付了一笔海运费用，先行支付给境内货代公司，现需向B公司收回该笔代垫运费，代垫期限为6个月，A公司财务人员携带资料前往银行柜台申请办理这笔收汇业务，银行以下做法正确的是（ ）","opts":["A.拒绝办理，A公司与B公司仅为贸易关系而非关联关系，银行无权直接办理，需报外汇局备案","B.审核业务真实性和合理性后直接办理，并在涉外收支申报交易附言中标明“贸易相关服务费用代垫”","C.审核业务真实性和合理性后直接办理，无需特别标注申报信息","D.要求企业先向所在地外汇局申请核准，凭外汇局出具的核准件办理"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"某企业在成功办理税务备案手续的当天到银行付款，如果银行经多次尝试仍无法办理税务备案信息核验，应当（ ）。","opts":["A.向客户解释原因，表示因无法核验税务备案信息，暂时无法对外付款","B.向客户解释原因，建议客户重新办理税务备案手续","C.在审核服务贸易对外支付真实性、合规性后，先行为客户办理，留存后续核验所需材料以补办核验手续，并在付汇当日向所在地外汇局报告","D.要求客户向外汇局备案，经外汇局同意后，再为企业办理付汇手续"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"中国红十字总会收到境外个人的1笔1万美元的捐款，需要到银行办理入账，应如何处理?（ ）","opts":["A.按照跨境投资有关规定办理","B.按照对外债权债务有关规定办理","C.凭申请书办理","D.凭列明用途的捐赠协议办理"],"ans":[2]},{"sec":"政策部分","type":"多选题","q":"企业办理名录登记后遗失“数字外管”平台互联网端密码，可通过以下哪些途径获取密码?（ ）","opts":["A.企业遗失操作员账号密码，可登录管理员账号自行重置密码。","B.企业需获取管理员账号初始用户名和初始密码，可在境内任一银行查询，银行确认企业身份后可告知企业初始用户名和初始密码。","C.企业在修改管理员账号初始密码后遗失密码，可通过办理名录登记时银行提供的外汇局联系电话联系外汇局，由外汇局确认企业身份后为企业重置密码。","D.企业在修改管理员账号初始密码后遗失密码，可与办理名录登记的银行联系，由银行确认企业身份后为企业重置密码。"],"ans":[0,1,2]},{"sec":"政策部分","type":"多选题","q":"某外贸综合服务企业在为委托客户提供代办出口收汇服务时，应当满足下列哪些条件?（ ）","opts":["A.经办银行需满足凭交易电子信息办理货物贸易外汇收支业务的条件","B.外贸综合服务企业已与委托客户签订综合服务合同（协议），提供报关报检、物流、退税、结算、信保等综合服务","C.外贸综合服务企业风险控制体系健全，具备\"交易留痕、风险可控\"的技术条件","D.外贸综合服务企业应向委托客户明示实际成交汇率，不得利用汇率价差非法牟利"],"ans":[0,1,2,3]},{"sec":"政策部分","type":"多选题","q":"银行对货物贸易外汇业务的内部管理，包括以下哪些内容（）","opts":["A.建立内控制度，包括客户调查、真实性审核、电子单证审核等内容","B.针对不同货物贸易外汇收支业务制定业务规范","C.建立货物贸易收支风险业务清单，完善内部管理机制","D.指导分支机构及时更新内控制度"],"ans":[0,1,2,3]},{"sec":"政策部分","type":"多选题","q":"某银行为一家B类企业办理一笔10万美元的未超可付汇额度的进口付汇业务。根据《经常项目外汇业务指引》，银行必须执行的操作包括（）","opts":["A.按规定审核相关交易单证","B.进行电子数据核查，扣减企业可付汇额度","C.在交易附言中标注“B类企业”字样","D.要求企业前往外汇局开具《登记表》"],"ans":[0,1]},{"sec":"政策部分","type":"多选题","q":"关于收支申报交易附言的填写，以下说法正确的是（ ）。","opts":["A.银行在办理涉及海关特殊监管区域保税货物的境内仓单转卖业务时，应在交易附言中标注“境内仓单转卖”。","B.银行在为A类企业办理单笔等值20万美元以下（含）的特殊退汇业务时，应在涉外收支申报交易附言中注明“特殊退汇+退汇业务类型（如超期限、非原路退回）”。","C.银行办理跨境电子商务、市场采购贸易、外贸综合服务等相关的货物贸易涉外收支时，应在涉外收支申报交易附言中注明“跨境电商”“市场采购”“外贸综合服务”。","D.银行在办理无法满足“同一笔业务原则上应在同一家银行，采用同一币种办理收支结算”的离岸转手买卖时，应在交易附言中注明“特殊离岸转手”。"],"ans":[0,1,2,3]},{"sec":"政策部分","type":"多选题","q":"银行在办理新型离岸国际贸易业务方面应符合以下哪些要求?( )","opts":["A.健全客户尽职调查、优化业务审核、实施事后监测管理和完善内部监督。","B.精准识别客户身份和业务模式，根据客户诚信等状况，动态实施内部风险分级评定","C.按照外汇管理规定的单证类型、单证种类进行审核","D.对客户主体、业务性质和关联交易进行穿透管理"],"ans":[0,1,3]},{"sec":"政策部分","type":"多选题","q":"某财政资金预算内单位因干部赴美国执行公务，前期已提取10万美元现钞，现因外币现钞未使用完，需将用剩的1万美元外币现钞存入原提钞外汇账户。以下说法正确的是（ ）。","opts":["A.该笔机构外币现钞提钞业务可直接在银行办理","B.该笔机构外币现钞提钞业务需到外汇局登记备案后再到银行办理","C.该笔机构外币现钞存钞业务可直接在银行办理","D.该笔机构外币现钞存钞业务需到外汇局登记备案后再到银行办理"],"ans":[0,2]},{"sec":"政策部分","type":"多选题","q":"关于服务贸易对外支付税务备案核验，下列说法正确的是（ ）","opts":["A.企业与境外交易对手签订了多份技术服务合同，单个合同支付金额均小于5万美元，但合并支付超过5万美元，银行仍需审核税务备案信息","B.服务贸易对外付汇金额原则上不可以超过税务备案的合同总金额，如因汇率折算、滞纳金等特殊原因出现对外付汇金额超过税务备案的合同总金额的，银行应在审核其交易的真实性和合理性后办理对外付汇","C.境内机构完成税务备案后，如备案要素中合同约定的币种发生变化，无需修改税务备案信息，银行可在审核真实性、合规性后及时办理对外支付","D. 境内机构完成税务备案后，如合同约定的执行期限要素发生变化，无需修改税务备案信息，银行可在审核真实性、合规性后及时办理对外支付"],"ans":[1,2]},{"sec":"政策部分","type":"多选题","q":"关于服务贸易退汇业务，以下说法错误的是（ ）","opts":["A.服务贸易退汇与原收、付款日期间隔原则上不能超180天（不含）","B.服务贸易退汇原则上可以超过原汇入或汇出金额","C.退汇金额在20万美元以上的服务贸易非原路退汇业务，需经外汇局登记后办理","D.对于服务贸易退汇的收付款人与原汇出/汇入不一致的，机构应向银行提供相关说明，银行审核相关真实性和合理性后办理"],"ans":[0,1,2]},{"sec":"政策部分","type":"多选题","q":"企业通过网银上传合同、发票扫描件申请办理服务贸易付汇。关于电子单证审核，下列说法正确的有（ ）","opts":["A. 银行为境内机构办理服务贸易外汇收支业务时，可以审核纸质单证，也可以审核电子单证","B. 合同、协议、发票、支付通知、结算清单等可作为证明交易真实性及相关要素的材料","C. 电子单证形式既包括系统自动生成的电子单证，也包括纸质单证电子扫描件","D. 银行应按规定留存审核后的纸质或电子材料备查"],"ans":[0,1,2,3]},{"sec":"政策部分","type":"多选题","q":"对于未纳入贸易外汇收支便利化及跨境贸易高水平开放试点的企业，银行在办理下列哪些货物贸易项下业务时，需要凭外汇局签发的《登记表》才能办理。（ ）","opts":["A.A类企业单笔等值21万美元且退汇日期与原收、付款日期间隔为200天的退汇业务","B.B类企业超可收付汇额度贸易收付汇","C.C类企业贸易外汇收支","D.A类企业单笔等值3万美元的非原路退汇业务"],"ans":[0,1,2]},{"sec":"政策部分","type":"多选题","q":"名录内企业以下哪些信息变更可在银行办理（）","opts":["A.企业名称变更","B.企业法定代表人变更","C.企业联系方式变更","D.所属外汇局发生变更"],"ans":[0,1,2]},{"sec":"政策部分","type":"多选题","q":"境内某企业D公司拟向境外某非营利性教育机构一次性捐赠8万美元，用于支持当地教育事业发展。D公司向银行申请办理该笔对外捐赠跨境付汇业务。根据现行外汇管理规定，银行在办理该业务时应重点关注以下哪些事项?（）","opts":["A.银行应为D公司开立捐赠外汇专用账户，并通过该账户办理捐赠外汇收支","B.该笔捐赠金额超过等值5万美元，银行应核验D公司税务备案信息","C.银行应要求D公司提供列明资金用途的捐赠协议","D.银行应审核境外非营利性机构在境外依法登记成立的文件"],"ans":[1,2,3]},{"sec":"政策部分","type":"判断题","q":"银行可依据跨境电商平台推荐将平台服务的跨境电商企业纳入贸易外汇收支便利化政策或跨境贸易高水平开放试点，无需开展准入尽职调查。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"某跨境电商企业通过9810模式将货物运至美国海外仓，报关金额50万美元，后续在电商平台实际销售收入55万美元，银行可为企业办理收汇55万美元。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"某跨境电商企业2025年10月末货物贸易收汇累计金额达到22万美元，该企业应自下一年度起在境内银行办理名录登记。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"2025年1-11月，A银行为某小微跨境电商企业凭交易电子信息已累计办理16万美元货物贸易收入业务，未发生汇出业务。2025年12月27日，该企业需办理一笔金额为5.5万美元的货物贸易汇出业务，银行工作人员在凭交易电子信息办理时表示，因企业收支金额累计超过20万美元，要求办理名录登记后，才能办理此笔汇出业务。（）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"海关特殊监管区域内A企业与境内另一海关特殊监管区域内B企业之间的货物贸易，既可以以人民币结算也可以外币计价结算。（）","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"境内A企业向境外支付一笔咨询服务费6万美元，已办理税务备案表登记，备案表中登记付汇账户为B银行的美元账户，后与境外协商签订补充协议支付人民币，故打算从C银行的人民币账户对外支付，此时C银行要求企业要修改税务备案表中的支付银行及账户信息方可办理付汇。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"企业办理服务贸易项下退汇时，收支应在同一银行办理。汇出资金退汇的境内收款银行应为原付款银行，汇入资金退汇的境内付款银行应为原收款银行。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"银行为跨境贸易高水平优质企业办理贸易外汇收支便利化业务时，对于单笔等值5万美元以上的服务贸易外汇支出可事后核验《服务贸易等项目对外支付税务备案表》。","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"办理向国际运输或国际运输代理企业划转国际运输项下运费及相关费用等境内外币支付时，划出方和汇入方银行均应按展业原则审核交易单证。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"只要被列为B类企业满6个月，银行就可凭《贸易外汇业务登记表》为企业办理90天以上（不含）的延期收款业务。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"审慎合规银行对便利化业务实施监测预警，应每月至少抽查20%的便利化业务。（ ）","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"境内H公司向境外M公司支付某份技术咨询合同项下的第二笔8万美元的服务费，此前H公司已就该合同项下第一笔6万美元服务费办理过税务备案，因此办理第二笔支付时无需再次税务备案。（ ）","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"判断题","q":"某境内企业到银行表示要向境外某培训公司（营利性机构）汇出一笔10万美元的捐赠款，用于资助其开展公益项目，这笔业务银行可直接按经常项下捐赠业务办理。","opts":["正确","错误"],"ans":[1]},{"sec":"政策部分","type":"判断题","q":"境内企业A办理跨境税费缴库退库业务，资金直接划转进入国库、收款方为税务机关，业务背景真实无误，银行可免于审业务单据，直接办理资金入账。（ ）","opts":["正确","错误"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"境内个人李某想要出国探望在美国读书的女儿，因此前往银行办理2万美元的现钞提钞业务。以下说法正确的是（）","opts":["A.李某可凭本人有效身份证件办理2万美元现钞提钞业务","B.李某需提供本人有效身份证件、提钞用途等证明材料向银行所在地外汇局事前报备","C.李某最多只能提取1万美元（含）的外币现钞","D.李某最多只能提取5000美元（含）的外币现钞"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"王某为境内个人，以下哪种情形涉嫌违规分拆结售汇行为（）","opts":["A.王某在境外学习，按学期分次汇出学费至境外","B.王某将本人在境外的薪酬收入，分次汇至本人境内的银行账户中结汇","C.王某让几个员工在年度便利化额度内分别购汇，并将资金集中汇至其境外银行账户中","D.王某因紧急就医，分3次购汇汇至境外医院账户"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"境外个人H在中国获得外国人永久居民身份证后，希望将其境内获得的薪酬购汇汇至其在美国的账户。以下说法正确的是（）","opts":["A.境外个人H可享受5万美元年度便利化购汇额度。","B.若金额超过5万美元，境外个人H需提供境外用途材料。","C.境外个人H购汇没有年度便利化额度，银行需审核薪酬相关材料，为其办理购付汇业务。","D.境外个人H需提供薪酬来源材料，办理年度便利化额度内购汇业务。"],"ans":[0]},{"sec":"政策部分","type":"单选题","q":"某客户曾因借用他人年度便利化额度分拆购汇被列入“关注名单”。现客户因子女境外留学需办理购汇汇款，以下说法不正确的是（ ）。","opts":["A.“关注名单”内个人，在关注期限内办理结售汇业务，应凭本人有效身份证件和有交易额的相关材料在银行办理。","B.“关注名单”内个人的关注期限为列入“关注名单”的当年及之后连续2年","C.被列入关注名单后，外汇局将暂停其所有外汇交易","D.银行应按照真实性审核原则，严格审核客户提供的相关证明材料"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"境外个人S外汇账户内有10万美元，要汇给朋友在新加坡的账户，需要提供什么材料（）","opts":["A.S本人的有效身份证件、汇出用途材料","B.S本人的有效身份证件","C.S本人的有效身份证件、境内收入来源材料","D.S本人的有效身份证件、收入来源材料、汇出用途材料"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"以下业务，银行可以按照个人经常项目特殊外汇业务处置制度办理的是（）","opts":["A.境内个人赵某为银行贵宾客户，拟将500万美元汇至境外用于办理移民","B.境内个人钱某已退休，当年在同一银行多个网点陆续提钞3万美元，本次要求再提钞1万美元，存放在家中备用，无法提供实际用途材料","C.境内个人孙某患重病，计划赴德国医治，其家属欲办理10万欧元购付汇，目前仅能提供境内医院的诊断书和住院证明等材料","D.境内个人张某去年汇出5万美元计划前往香港旅游，但后续未成行，汇出资金购买了定期存款，现拟将本金和利息汇回"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"境内个人王某在英国留学，需缴纳学费6万美元，王某之前已使用本人年度便利化额度购汇5万美元，到银行咨询如何办理剩余1万美元的购汇业务。银行的说法正确的是（）。","opts":["A.年度便利化购汇额度已用完，需要到明年额度恢复后才能购汇","B.可凭本人有效身份证件和学费收缴通知等材料办理不占用年度便利化额度的购汇","C.借用朋友的年度便利化额度进行购汇","D.超过年度便利化额度的购汇无法办理"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"银行在办理个人购汇业务时，可根据首次办理情况免于审核重复性材料的业务不包括（ ）","opts":["A.在英国留学的境内个人秦某在留学期间办理不占用年度便利化额度的留学学费购汇","B.在新加坡工作的境内个人黄某办理不占用年度便利化额度的外币薪酬结汇","C.在北京工作的境内个人王某收到境外公司汇入咨询费用结汇","D.在上海工作的境外个人J在劳动合同有效期内的人民币薪酬收入购汇"],"ans":[2]},{"sec":"政策部分","type":"单选题","q":"境内个人胡某的堂弟在美国生活，去年确诊患有严重疾病，药物费用昂贵且需长期定时复查，但其境外资金无法满足后续治疗所需，故向胡某求助。胡某前往银行柜台办理购付汇业务，以下说法正确的是（）","opts":["A.胡某可为堂弟代办年度便利化额度内的购汇业务","B.银行审核胡某提供的境外医院诊断证明等材料，联系堂弟核实身份和就医背景，确认具有真实合法的交易背景后，按特殊业务处置制度为胡某办理购付汇业务","C.胡某与堂弟非近亲属且无赡养关系，直接拒绝","D.胡某提供的不是本人在境外医院的缴费单，不能办理不占年度便利化额度的购汇业务"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"境内个人陈某一个月内向境外同一账户付汇5次，每次5万美元，银行应如何处理（）","opts":["A.每笔均不超过5万美元，无需干涉","B.银行识别并拦截陈某的异常交易，进一步了解汇出资金用途情况，在确保交易背景真实、合法后，为其办理付汇","C.陈某提供资金用途材料后，仍拒绝为其办理业务","D.建议陈某找亲戚朋友分开办理"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"关于优质企业涉外员工薪酬用汇政策，以下错误的是（）","opts":["A.银行在充分展业、风险可控的前提下，可自主决定审核优质企业提供的薪酬相关材料","B.涉外员工限于优质企业聘请的外籍员工","C.银行根据薪酬相关材料，为优质企业认定的涉外员工核定免审单金额，个人在核定金额范围内无需另行提供单证","D.银行应为企业配套制定专属方案，做好购付汇或收结汇金额动态管理，建立事中事后管理机制"],"ans":[1]},{"sec":"政策部分","type":"单选题","q":"境内个人汪某曾通过留学中介机构汇出学费8万美元，后因故取消留学，境外学校直接将学费退回至汪某个人账户中，银行应该怎样办理?","opts":["A.因为该笔资金汇出汇入的币种、汇路不一致，不能认定为退汇，所以不予办理","B.引导汪某利用其便利化额度，分两年办理结汇","C.审核汪某提供的与中介机构签订的合同、留学录取通知书，核实汇出的金额与学费资金相匹配，具有真实合法的交易背景，可为其办理入账结汇业务","D.退回该笔资金，要求汪某联系境外学校将学费退至中介机构的账户上"],"ans":[2]},{"sec":"政策部分","type":"多选题","q":"境外个人J在境内一家外企工作，每月有合法人民币工资收入，近日前往银行申请购汇，并询问购汇后的资金可以如何使用。以下说法正确的是（）","opts":["A.J可将购汇资金汇回自己母国账户","B.J可将购汇资金存入本人的外汇储蓄账户","C.J可按规定提取外币现钞携带出境","D.J可将购汇资金直接划转至境内朋友个人账户"],"ans":[0,1,2]},{"sec":"政策部分","type":"多选题","q":"境内个人陆某的孩子（境内个人）即将前往境外留学，为办理留学签证，需汇出保证金，以下错误的有（）","opts":["A.保证金不属于经常项下业务，不能办理","B.该业务风险较大，难以跟踪资金后续用途，不予办理","C 辑合理性，防止企业通过虚假贸易背景套取行社融资。","opts":["正确","错误"],"ans":[0]},{"sec":"制度部分","type":"判断题","q":"出口押汇等具有出口背景的国内外汇贷款按规定进入经常项目外汇结算账户并办理结汇的，企业应以自有外汇或货物贸易出口收汇资金偿还。","opts":["正确","错误"],"ans":[1]},{"sec":"制度部分","type":"单选题","q":"在企业出口确实无法按期收汇且没有其他外汇资金可用于偿还上述国内外汇贷款时，办理贷款的开办行社可按照展业原则，审慎为企业办理购汇偿还手续，并于每月初 （） 个工作日内向所在地外汇局报告。","opts":["1","2","3","5"],"ans":[3]},{"sec":"制度部分","type":"判断题","q":"开办行社办理货物贸易对外付汇业务，可按照展业原则，自主决定是否对相应进口报关电子信息办理核验手续；开办行社能确认企业对外付汇业务真实合法的，可不办理核验手续。","opts":["正确","错误"],"ans":[0]},{"sec":"制度部分","type":"单选题","q":"对于企业已完成进口报关手续的，开办行社自办理货物贸易 对外付汇业务之日起（）个工作日内，按照本次货物贸易对外付汇金额，在货贸系统中办理核验手续。","opts":["2","5","10","15"],"ans":[1]},{"sec":"制度部分","type":"单选题","q":"对于企业未完成进口报关手续的，开办行社可要求企业在完 成报关手续之日起 （）日内提供相应的报关信息，并按照本次货物贸易对外付汇金额，在货贸系统中补办核验手续。","opts":["10","20","30","40"],"ans":[3]},{"sec":"制度部分","type":"多选题","q":"开办行社在办理进口报关电子信息核验手续时，对于存在下列情况之一的企业，应逐笔在货贸系统中对企业加注相应标识：（）。","opts":["未在规定期限内提供报关信息且无合理解释的。","涉嫌重复使用报关信息且无合理解释的。","涉嫌使用虚假报关信息的。","其他需加注标识的情况。"],"ans":[0,1,2,3]},{"sec":"制度部分","type":"多选题","q":"货物贸易收付款核查专用信息包括但不限于：（）等。","opts":["是否为保税货物项下付款","合同号","发票号","提运单号/仓单号"],"ans":[0,1,2,3]},{"sec":"制度部分","type":"判断题","q":"开办行社在办理涉及海关特殊监管区域保税货物的境内仓单转卖业务时，应在涉外收支申报交易附言中标注“境内仓单转卖”字样。","opts":["正确","错误"],"ans":[0]},{"sec":"制度部分","type":"判断题","q":"开办行社按规定办理货物贸易收付汇单位与进出口单位不一致业务时，在涉外收支申报交易附言中标注“非报关人”字样。","opts":["正确","错误"],"ans":[0]},{"sec":"制度部分","type":"判断题","q":"开办行社为企业办理货物贸易提前购汇后，因合同变更等原因导致企业提前购汇后未能对外支付的进口货款，企业不得将该货款结汇。","opts":["正确","错误"],"ans":[1]},{"sec":"制度部分","type":"判断题","q":"进口项下退汇的境外付款人无须为原收款人，但境内收款人应为原付款人。出口项下退汇的境内付款人应为原收款人，境外收款人无须为原付款人。","opts":["正确","错误"],"ans":[1]},{"sec":"制度部分","type":"判断题","q":"开办行社在为A类企业办理单笔等值5万美元以下（含）的退汇业务时，对于退汇日期与原收、付款日期间隔在180天以上（不含）或由于特殊情况无法原路退回的退汇，开办行社应审核外汇局签发的《贸易外汇业务登记表》、相应交易单证外，还应对超期限或无法原路退汇的原因进行合理审核，并通过货贸系统签注《登记表》使用情况。","opts":["正确","错误"],"ans":[1]},{"sec":"制度部分","type":"单选题","q":"根据外汇局货物贸易企业分类管理要求，在分类管理有效期内，适用便利化的管理措施的企业为：（）。","opts":["D类企业","C类企业","B类企业","A类企业"],"ans":[3]},{"sec":"制度部分","type":"单选题","q":"开办行社在为分类监管有效期内的B类企业办理货物贸易外汇收支业务，应按以下规 专题","type":"判断题","q":"计算跨境融资风险加权余额及上限时，未在中国外汇交易中心挂牌交易的货币，适用人民币汇率中间价。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"目前对企业和金融机构，中国人民银行、国家外汇管理局不实行外债事前审批，企业和金融机构均改为事前签约备案。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"证券投资基金跨境发行销售，是指内地基金经中国证监会和香港证监会认可后在香港地区发行及销售。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"转口贸易可以使用人民币进行结算，境内结算银行在办理相关人民币结算业务时要履行贸易真实性审核义务。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境内机构可先办理境外直接投资人民币资金汇出或前期费用人民币资金汇出，再办理前期费用汇出或境外直接投资登记手续。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境内结算银行应当按照中国人民银行的规定，对人民币跨境收支交易单证的真实性及其与人民币收支的一致性进行合理审查。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"跨国企业集团同一境内成员企业可以加入多个资金池。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外机构投资者仅汇入外币资金的，须开立外币专用账户及与外币专用账户相对应的人民币专用存款账户。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境内企业可根据实际需要就一笔境外人民币借款开立多个人民币专用存款账户，也可就多笔境外人民币借款使用同一个人民币专用存款账户办理资金收付。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境外投资者经国务院金融监督管理机构批准，按有关法律规定投资境内金融机构，可使用人民币投资，具体包括新设、增资、并购、参股、股权转让、利润分配、清算、减资、股份减持或先行收回投资等。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"凡依法可以使用外汇结算的跨境交易，企业都可以使用人民币结算。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"人民币境外直接投资中，前期费用是指境内机构在境外设立项目或企业前，需要向境外支付的与境外直接投资有关的费用。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"同一笔境外人民币放款可以多次展期。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"企业将人民币境外放款转为股权投资的，银行审核境外直接投资主管部门的核准或备案文件等相关材料即可，无需在人民币跨境收付信息管理系统（RCPMIS）进行相应信息变更及登记。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对于国际收支统计申报和人民币跨境收付信息管理系统数据报送在服务贸易项下的新型离岸国际贸易，无需注明交易附言。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对于外贸新业态跨境人民币业务，轧差净额结算应还原为收款和付款信息报送。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行将中方股东开立的用于并购或股权转让的个人银行结算账户向人民币跨境收付信息管理系统报备时，应在“备注”最前面注明“并购”或“股权转让”字样。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行未接入人民币跨境收付信息管理系统即开展跨境人民币业务或者未按照规定报送信息的，中国人民银行可采取罚款措施；情节严重的，可暂停其继续办理跨境人民币业务。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"RCPMIS二代的直联，是指报文的关键字段数据从接入机构内部系统（核心系统或业务系统）自动采集，且原则上不允许人工干预。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行的人民币保函业务不纳入现行外债管理，也不需要向人民币跨境收付信息管理系统报送保函及履约信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"按照银发〔2020〕330 号文相关要求，外商投资企业境内再投资的被投资企业、境外投资者利润再投资的被投资企业，无需开立人民币资本金专用存款账户，对于前期已开立的资本金专户，无需向人民币跨境收付信息管理系统报送相应账户及余额信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"银行可以通过直联方式或间联方式接入人民币跨境收付信息管理系统，其中直联方式是主要接入模式。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行可以自行决定是否接入人民币跨境收付信息管理系统。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"人民币跨境收付信息管理系统中，银行用户分为系统管理员和业务操作员两类，其中系统管理员负责管理本级业务操作员和下级系统管理员。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行在报送人民币跨境收付信息时，可以不报送境外机构投资者相关信息数据。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"银行在报送人民币跨境收付信息时，允许报送信息与银行内部业务处理系统和会计核算系统信息存在差异。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"非居民个人在境内开立的人民币账户，与在境外开立的人民币账户发生人民币跨境收付时，为其办理结算业务的银行需报送人民币跨境收入/支出信息。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"人民币跨境支出信息报送时间要求是自业务发生日起5个工作日内。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"银行退出RCPMIS时，无需书面报告人民银行分支机构。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外贷款业务涉及跨境担保的，应根据有关规定，直接向人民币跨境收付信息管理系统报送跨境担保相关信息，境内银行因担保履约产生的对外债权应纳入其境外贷款余额管理。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"第二代人民币跨境收付信息管理系统正式上线于2021年。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"首次办理跨境人民币结算业务的个人需要向人民币跨境收付信息管理系统报送基本信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外机构境内外币NRA 账户办理结汇并汇入境内机构或个人人民币账户的，人民币购售业务信息（2102）中购售用途应按照实际跨境交易背景填写。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"在RCPMIS申报一般贸易预收/付款业务时，预收付款比例可以大于1。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外投资企业涉及多个境内投资主体的，应由每个投资主体的境内结算银行在RCPMIS报送人民币跨境对外直接投资业务信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外机构人民币账户信息（2120）的报送时间要求为自开立人民币账户日起5个工作日内。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"RCPMIS只采集跨境人民币业务及相关的跨境资金流动信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"RCPMIS各类业务报文之间不存在关联性。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对于个人单笔20万元(含)以下的人民币跨境支出,可以通过“小额批量人民币跨境支出信息(2119)”报文批量报送信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"金融衍生品掉期涉及近端和远端的交易均需要报送金融衍生品交易信息（2180）。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"若要变更已报送至 RCPMIS 的直联报文信息，直接在信息报送系统中进行变更。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"中国人民银行根据宏观审慎管理需要，可拓宽和调整RCPMIS外币业务信息采集","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"经常项下跨境人民币集中收付业务 RCPMIS报送中的“金额从大原则”是指一笔涉外收付款涉及多种交易性质时按照金额最大的交易性质申报交易编码。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行应在业务单证审核、审慎经营、持续监控和内控管理等环节，对客户提交的经常项目交易单证的真实性及其与跨境人民币收支的一致性进行尽职审查。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"办事处、代表处等办公经费收支业务办理前需确定是国家相关主管部门批准同意设立的机构。办公经费仅限经常项目支出，不应用于购买房产等固定资产投资。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行可以引导或配合客户利用境内外汇率和利率的差异等因素，通过经常项目跨境人民币业务渠道开展违反法规和政策要求的投机套利交易。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"银行在落实“展业三原则”基础上，为优质企业提供更高水平的便利化服务，凭优质企业提交的《跨境人民币结算收/付款说明》或收付款指令，直接为其办理货物贸易跨境人民币结算，包括离岸转手买卖、退款业务。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对重点监管企业、重点关注业务和高频、大额等异常业务，应执行严格的单证审核标准，采取调查客户背景、分析业务合理性等方式，强化审查措施，通过常规的管理措施有效防范业务风险。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"在为客户办理跨境汇出汇款时，应完整登记并留存汇款人的姓名、账号、地址（地址信息必须包含国家/地区名称）、收款人的姓名、地址（如无法提供收款人详细地址，应至少提供国家及城市信息）等信息，并向接收汇款的金融机构如实传递上述信息，可以修改、掩饰、删除有关信息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"在可信客户与关注客户可以在一定条件下相互转换。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"货物贸易跨境收支主体原则上应与进出口报关单收货人/发货人一致，按照“谁出口谁收款、谁进口谁付款”原则办理跨境人民币收支业务。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"企业在办理货物贸易跨境人民币结算业务时，银行应根据客户分类、以及办理的业务种类等方面来决定对其业务的审核力度和业务办理的便利化程度。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"记名海运提单可以转让。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"陆运单不是货权凭证，不可转让。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"空运单不是货权凭证，不可转让。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"一般情况下，报关总价应与发票一致，合同、进出口货物报关单、装箱单等单证的货物描述应一致。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"装船日期原则上应不早于合同日期。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"属于国家控制的特殊进出口商品，应具备相关的进出口许可证、配额证等批件。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"办理跨境货物贸易付款业务后，银行可根据内控要求和实际业务需要，按照实质合规原则，自主决定是否在单证正本上签注收付汇金额、日期并加盖业务印章。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"对于境外抵付业务，银行应要求企业提供境外抵付的人民币资金金额、开户银行、账户、用途及对应的进口报关等信息，并向RCPMIS报送。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"出口跨境人民币收款应根据不同结算方式审核相应的有效凭证和商业单据。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"对于关注客户货物贸易项下人民币结算资金需要自动入账的，银行可先为其办理入账，再进行相关贸易真实性审核。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"企业办理来料加工贸易项下跨境人民币结算业务时，需向境内结算银行提交所在地商务部门出具的加工贸易业务批准证。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"列入跨境人民币业务重点监管名单内的企业可将跨境贸易人民币结算业务所获得的资金存放境外。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"同一笔离岸转手买卖业务原则上应在同一家银行网点采用同一币种办理收支结算。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"可信客户办理单笔40万元（含）以下的服务贸易跨境人民币汇出，银行原则上可不审核交易单证，但对于资金性质不明确的业务，银行应要求境内机构和境内个人提交交易单证进行合理审查，交易单证可参考40万元以上的服务贸易资料。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"对于关联企业间办理离岸转手买卖的，应注意防范关联企业间无贸易背景、涉嫌洗钱的跨境资金异常流动等行为。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"因错误汇入/出产生的退款，应在合理期限内办理。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境内银行可为香港、澳门居民开立个人人民币银行结算账户，用于接收香港、澳门居民同名账户汇入资金，其中汇入资金可用购买有价证券、金融衍生品、资产管理产品等金融产品。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"银行可为香港、澳门居民个人办理对大陆的同名跨境人民币汇款及未提用部分的汇回。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"台湾居民个人对大陆跨境汇款的收款账户仅限于同名账户。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外投资者在境内拟设立多个外商投资企业或项目的，可分别开立人民币前期费用专用存款账户。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"银行为企业办理外商直接投资项下业务,其开立的人民币前期费用专用存款账户按照人民币NRA账户相关要求进行管理。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"企业办理外商直接投资项下业务,人民币前期费用专用存款账户可以办理现金收付业务，账户内的资金不得用于土地招拍挂或购买房产。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外投资者以人民币并购境内企业设立外商投资企业或以人民币向境内外商投资企业的中方股东支付股权转让对价款，相关各中方股东无需开立人民币并购专用存款账户或人民币股权转让专用存款账户。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"企业人民币境外放款的还本付息资金必须以人民币汇回其境外放款专用账户。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"贸易融资业务中若存在代理同业业务的情况，如代理同业开立进口信用证等，对客户的尽职调查责任及对业务的合规性、真实性审核责任、反洗钱等审查应归属于该代理业务的受托行。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"内保外贷项下资金不得通过股权或债权方式调回境内使用。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"未经国家外汇管理局批准，内保外贷项下资金不得直接或间接以证券投资方式调回境内使用。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"内保外贷项下担保责任为境外机构衍生交易项下支付义务时，境外债务人从事衍生交易应当以止损保值为目的，符合其主营业务范围且经过适当授权。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"内保外贷项下担保责任为境外债务人债券发行项下还款义务时，境外债务人应由境内机构直接或间接持股。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"担保人对担保责任上限无法进行合理预计的内保外贷，可以不办理登记，但经外汇局核准后可以办理担保履约手续。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"在境内注册成立的金融企业也可以办理人民币境外放款业务。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境内企业在境外发行人民币债券，按全口径跨境融资宏观审慎管理规定办理相关手续后，可根据实际需要将募集资金汇入境内使用。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"对于以外商投资企业为受益人的境外机构和个人对境内银行提供担保，已实际履约的人民币金额不计入境外借款总规模。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"外商投资企业境外人民币借款转增资本的，相应的借款不计入外商投资企业境外借款总规模。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"企业必须在境外人民币借款结算行办理借款还本付息。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境内企业人民币境外放款提前还款额计入企业境外放款余额。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境外直接投资人民币业务中，境内投资主体短期内集中办理境外直接投资登记业务的机构、有“快设快出”行为的机构应列为关注客户。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境外直接投资人民币业务中，境内机构已经汇出境外的人民币前期费用，应当列入其境外直接投资总额。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"境内企业申请境外放款资金汇出金额可超过国家外汇管理局资本项目信息系统银行端打印的境外放款额度控制信息表中的尚可汇出金额。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对于短期频繁发生的境外放款业务，经办行应要求放款人提供相关情况说明，一旦发现有违规行为，立即停止为其办理新的境外放款业务。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"人民币境外放款可以展期，但原则上同一笔境外人民币放款展期不超过两次。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境内银行境外人民币贷款资金可以用作对境内提供贷款。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"金融机构办理服务贸易跨境人民币收支业务，应当将审查后的交易单证作为业务档案留存3年备查。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"境内机构人民币利润汇出前应先依法弥补以前年度亏损。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"利润汇出金额应与董事会决议以及纳税证明材料中的金额相符，企业本年度处置金额原则上不超过最近一期财务审计报告中属于外方股东的“应付股利”的金额。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"在知晓或有合理理由怀疑客户无真实投资背景，交易目的不合理，资金来源不合法，或涉嫌通过虚假、伪造、变造凭证向银行申请办理业务的，银行可拒绝为客户办理境外直接投资跨境人民币业务。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"商业银行不可以为跨境人民币业务重点监管企业名单内的企业办理跨境人民币业务。","opts":["正确","错误"],"ans":[1]},{"sec":"跨境人民币专题","type":"判断题","q":"对于外商对于涉及前期费用金额过大、与投资者规模相比明显不合理的，应加强业务背景真实性、合规性审核。","opts":["正确","错误"],"ans":[0]},{"sec":"跨境人民币专题","type":"判断题","q":"重点监管企业开展跨境人民币结算业务所获得的人民币资金不得存放境外。","opts":["正确","错误"],"ans":[0]}]</script>
<script>
'use strict';
window.addEventListener('error', function(e){
  var msg = e && e.message ? e.message : '';
  if(!msg || msg==='Script error.' || msg==='Script error') return; // 跨域脱敏噪音
  var b=document.getElementById('errbox'); b.style.display='block'; b.textContent='E: '+msg;
});

/* ---------- 数据 ---------- */
var BANK = (function(){
  try{ return JSON.parse(document.getElementById('bank-data').textContent); }
  catch(e){ return []; }
})();
var SECS = (function(){ var s={}; BANK.forEach(function(q){ s[q.sec]=1; }); return Object.keys(s); })();
var TYPEMAP = {'单选题':'单选','多选题':'多选','判断题':'判断'};
var CIRC = [6.2832*52, 6.2832*52];

/* ---------- 存储 ---------- */
function lsGet(k, d){ try{ var v=localStorage.getItem('hl_'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem('hl_'+k, JSON.stringify(v)); }catch(e){} }

var S = {
  theme: 'mist',
  instant: lsGet('instant',true),
  auto: lsGet('auto',true),
  autoDelay: lsGet('autoDelay',2),
  reciteAuto: lsGet('reciteAuto',false),
  fx: lsGet('fx',true),
  sound: lsGet('sound',true),
  qshuf: false, oshuf: false,
  stats: lsGet('stats',{}),        // qid -> {r,w, last, iv} iv=遗忘曲线间隔
  wrong: lsGet('wrong',[]),        // qid list
  doneOnce: lsGet('doneOnce',{})   // qid -> 1 (做过的题)
};

/* ---------- 主题(单套: 白底农信红绿) ---------- */
function applyTheme(k){
  var m = document.querySelector('meta[name=theme-color]'); if(m) m.content='#fbfafa';
  S.theme='mist'; lsSet('theme','mist');
}
function renderThemes(){}

/* ---------- 视图路由 ---------- */
var views=['vHome','vConf','vQuiz','vAnsSheet','vResult','vWrong','vStats','vSettings'];
var curView='vHome';
function show(id){
  views.forEach(function(v){ document.getElementById(v).classList.toggle('on', v===id); });
  curView=id;
  try{ if(id!=='vHome'&&id!=='vConf') localStorage.setItem('lastView', id); }catch(e){}
  var inQuiz = (id==='vQuiz'||id==='vAnsSheet'||id==='vResult');
  document.getElementById('topbar').style.display = inQuiz? 'block':'none';
  document.getElementById('nav').style.display = inQuiz? 'none':'flex';
  window.scrollTo(0,0);
}

/* ---------- 工具 ---------- */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmtPct(a,b){ return b? Math.round(a/b*100)+'%':'--'; }

/* ---------- 统计记录 ---------- */
function recAnswer(q, right){
  var st = S.stats[q.__id] || {r:0,w:0,last:0,iv:0};
  if(right){ st.r++; } else { st.w++; }
  st.last = Date.now();
  if(!right){ st.iv = 0; if(S.wrong.indexOf(q.__id)<0) S.wrong.push(q.__id); }
  else {
    if(q.__mode==='forget' || S.wrong.indexOf(q.__id)>=0){
      st.iv = (st.iv||0)+1; // 遗忘曲线升级
      if(st.iv>=3){ var ix=S.wrong.indexOf(q.__id); if(ix>=0){ S.wrong.splice(ix,1); } }
    }
  }
  S.stats[q.__id]=st; S.doneOnce[q.__id]=1;
  lsSet('stats',S.stats); lsSet('wrong',S.wrong); lsSet('doneOnce',S.doneOnce);
}

/* ---------- 音效 (WebAudio, 无外部文件) ---------- */
var AC=null;
function beep(ok){
  if(!S.sound) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t=AC.currentTime;
    var o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(ok){
      o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(880,t+0.08);
      g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      o.start(t); o.stop(t+0.22);
    } else {
      o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(140,t+0.25);
      g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      o.start(t); o.stop(t+0.28);
    }
  }catch(e){}
}

/* ---------- 刷题引擎 ---------- */
var Quiz = null;
function saveSession(){
  if(!Quiz||Quiz.mode==='review') return;
  try{
    var ids=[];
    Quiz.qs.forEach(function(q){ ids.push(q.__id); });
    localStorage.setItem('quizSession', JSON.stringify({
      ids:ids, opt:{mode:Quiz.mode,instant:Quiz.opt.instant,auto:Quiz.opt.auto,timer:Quiz.opt.timer,recite:Quiz.opt.recite},
      i:Quiz.i, linIdx:Quiz.linIdx, ans:Quiz.ans, judged:Quiz.judged,
      right:Quiz.right, wrongn:Quiz.wrongn, rounds:Quiz.rounds,
      loopQ:Quiz.loopQ||[], needMap:Quiz.needMap||{}, graduated:Quiz.graduated||0
    }));
  }catch(e){}
}
function restoreSession(){
  try{
    var raw=localStorage.getItem('quizSession');
    if(!raw) return false;
    var sv=JSON.parse(raw);
    if(!sv.ids||!sv.ids.length) return false;
    var list=[];
    sv.ids.forEach(function(id){ if(BANK[id]) list.push(id); });
    if(!list.length) return false;
    buildQuiz(list, sv.opt);
    Quiz.i=Math.min(sv.i||0, list.length-1);
    Quiz.linIdx=sv.linIdx; Quiz.ans=sv.ans||{}; Quiz.judged=sv.judged||{};
    Quiz.right=sv.right||0; Quiz.wrongn=sv.wrongn||0; Quiz.rounds=sv.rounds||0;
    Quiz.loopQ=sv.loopQ||[]; Quiz.needMap=sv.needMap||{}; Quiz.graduated=sv.graduated||0;
    return true;
  }catch(e){ return false; }
}

function buildQuiz(list, opt){
  // opt: {instant, auto, timer, loop, recite, mode}
  var qs = list.map(function(idx){ var q = Object.assign({}, BANK[idx]); q.__id=idx; return q; });
  Quiz = {
    qs: qs, i:0, mode:opt.mode||'seq', ans:{}, right:0, wrongn:0,
    opt: opt, done:false, timer:null, tleft:0,
    loopQ: [],        // 待重现错题 [{idx(在qs中), need}] need=还需连对次数
    loopGap: opt.gap||5, loopStreak: opt.streak||3,
    rounds: 0         // 实际作答轮数
  };
}
function curQ(){ return Quiz? Quiz.qs[Quiz.i] : null; }

function renderQ(){
  if(!Quiz) return;
  var q = curQ();
  if(!q){ finishQuiz(); return; }
  if(Quiz.mode==='loop' && Quiz.i===Quiz.__lastIdx && Quiz.__reentry){ /*重现*/ }
  Quiz.__lastIdx=Quiz.i;
  show('vQuiz');
  document.getElementById('topTitle').textContent = MODE_TITLE[Quiz.mode]||'外汇考试';
  document.getElementById('qType').textContent = TYPEMAP[q.type]||q.type;
  document.getElementById('qText').textContent = q.q;
  var st = S.stats[q.__id]||{};
  var sub = '第 '+(Quiz.i+1)+' / '+Quiz.qs.length+' 题 · 答'+(st.r||0)+'错'+(st.w||0);
  var noEl = document.querySelector('.qtop .qno');
  // 题号行在qtop内, 这里用type+timer行即可; 补充统计到qtext前
  var rt='';
  if(Quiz.mode==='loop'){
    var inQ=Quiz.loopQ.some(function(e){ return e.idx===Quiz.i; });
    if(inQ){ var nm=(Quiz.needMap&&Quiz.needMap[Quiz.i]!=null)?Quiz.needMap[Quiz.i]:Quiz.loopStreak; rt=' · 重现(还需连对'+nm+')'; }
  }
  document.getElementById('qType').textContent = (TYPEMAP[q.type]||q.type) + ' · 累计对'+(st.r||0)+'/错'+(st.w||0) + rt;

  var wrap = document.getElementById('qOpts');
  var letters='ABCDEFGH';
  var order = q.__order || (function(){ var o=q.opts.map(function(_,i){return i;}); if(S.oshuf && q.type!=='判断题'){ /* keep mapping stable per question via stored */ } return o; })();
  if(!q.__render){ q.__render = order; }
  var ans = Quiz.ans[Quiz.i];
  var html='';
  order.forEach(function(oi, di){
    var cls='opt';
 if(ans!==undefined && ans.indexOf(oi)>=0) cls+=' sel';
 var judged = sameSetNeedJudge(Quiz,q,ans||[]);
 if(judged && ans && ans.length){
   if(q.ans.indexOf(oi)>=0) cls+=' right';
   else if(ans.indexOf(oi)>=0) cls+=' wrong';
   else cls+=' dim';
 }
    html+='<button class="'+cls+'" data-o="'+oi+'"><span class="ol">'+letters[di]+'</span><span class="ot">'+esc(q.opts[oi])+'</span></button>';
  });
  wrap.innerHTML=html;
  // 判定状态
  var fb=document.getElementById('qFb'), ex=document.getElementById('qExp'), act=document.getElementById('qAct');
  fb.className='feedback'; fb.textContent='';
  ex.classList.remove('show');
  // 确认按钮常驻: 已判定→禁用态; 未判定→可点
  var judgedNow = sameSetNeedJudge(Quiz,q,ans) || (ans && ans.length && ans[0]===-1);
  act.style.display='flex';
  var sb=document.getElementById('qSubmit');
  sb.disabled=!!judgedNow;
  sb.classList.toggle('disabled', !!judgedNow);
  if(ans!==undefined && ans.length && ans[0]!==-1 && sameSetNeedJudge(Quiz,q,ans)){
    var right = sameSet(ans, q.ans);
    fb.className='feedback show '+(right?'ok':'bad');
    fb.textContent = right? '回答正确':'回答错误 · 正确答案 '+ansLetters(q.ans);
    if(q.exp){ document.getElementById('qExpTx').textContent=q.exp; ex.classList.add('show'); }
    if(Quiz.opt.instant && Quiz.opt.auto && right && !Quiz.done) schedAuto();
  } else if(ans && ans.length && ans[0]===-1){
    // 超时标记: 显示正确答案
    fb.className='feedback show bad';
    fb.textContent='超时 · 正确答案 '+ansLetters(q.ans);
    buzz(false);
    if(q.exp){ document.getElementById('qExpTx').textContent=q.exp; ex.classList.add('show'); }
  } else if(Quiz.opt.recite){
    // 背题模式: 未作答时直接显示答案
    markRecite();
  }
  if(Quiz.opt.recite) markRecite();
  // 进度
  var progPct=0;
  if(Quiz.mode==='loop'){
    var grad=Quiz.graduated||0;
    var remain=Quiz.qs.length-grad;
    document.getElementById('tinyLbl') && (document.getElementById('tinyLbl').textContent='循环题库剩 '+remain+' / '+Quiz.qs.length);
    progPct=grad/Quiz.qs.length*100;
  } else {
    progPct=(Quiz.i)/Quiz.qs.length*100;
  }
  document.getElementById('tinyFill').style.width = progPct+'%';
  var tp=document.getElementById('tinyPct');
  if(tp){ tp.textContent=Math.round(progPct)+'%'; tp.style.left=Math.max(4,Math.min(96,progPct))+'%'; }
  // 上一题按钮
  document.getElementById('qPrev').style.visibility = (Quiz.mode==='loop')? 'hidden' : (Quiz.i>0? 'visible':'hidden');
  document.getElementById('qNext').textContent = Quiz.i<Quiz.qs.length-1? '下一题':'完成';
  var cb=document.getElementById('qCardBtn');
  cb.style.display = (Quiz.mode==='loop')? 'none':'inline-block';
  // 计时
  stopTimer();
  if(Quiz.opt.timer && ans===undefined && !Quiz.opt.recite){ startTimer(Quiz.opt.timer); }
  else { document.getElementById('qTimer').textContent=''; }
  saveSession();
}
function ansLetters(q){ var L='ABCDEFGH'; return q.map(function(i){return L[i];}).join(''); }
function sameSetNeedJudge(Qz,q,ans){
  // 多选: 已有选择但未确认(非instant) → 未判定状态由Qz.judged标志控制
  return Qz.judged ? Qz.judged[Qz.i] : (q.type!=='多选题' && Qz.opt.instant);
}
function sameSet(a,b){ if(a.length!==b.length) return false; var s={}; b.forEach(function(x){s[x]=1;}); return a.every(function(x){return s[x];}); }
function markRecite(){
  var q=curQ();
  document.querySelectorAll('#qOpts .opt').forEach(function(el){
    var oi=+el.getAttribute('data-o');
    el.classList.add(q.ans.indexOf(oi)>=0?'right':'dim');
  });
  var ex=document.getElementById('qExp');
  if(q.exp){ document.getElementById('qExpTx').textContent=q.exp; ex.classList.add('show'); }
}
var autoT=null;
function schedAuto(){
  clearTimeout(autoT);
  autoT=setTimeout(function(){ if(Quiz && !Quiz.done && curQ() && sameSet(Quiz.ans[Quiz.i]||[], curQ().ans)) nextQ(); }, S.autoDelay*1000);
}
function startTimer(sec){
  Quiz.tleft=sec; stopTimer();
  var el=document.getElementById('qTimer');
  el.classList.remove('low'); el.textContent=sec+'s';
  Quiz.timer=setInterval(function(){
    Quiz.tleft--;
    el.textContent=Quiz.tleft+'s';
    if(Quiz.tleft<=3) el.classList.add('low');
    if(Quiz.tleft<=0){
      stopTimer();
      // 超时: 回显答案并跳下一题
      var q=curQ();
      if(q){
        Quiz.ans[Quiz.i]=[-1]; // 视为错
        recAnswer(q,false); recordRound(false);
        renderQ();
        setTimeout(function(){ if(Quiz&&!Quiz.done) nextQ(); }, 1500);
      }
    }
  },1000);
}
function stopTimer(){ if(Quiz&&Quiz.timer){ clearInterval(Quiz.timer); Quiz.timer=null; } }

function pickOpt(oi){
  if(!Quiz||Quiz.done) return;
  var q=curQ();
  var cur=Quiz.ans[Quiz.i]||[];
  if(q.type==='多选题'){
    var ix=cur.indexOf(oi);
    if(ix>=0) cur.splice(ix,1); else cur.push(oi);
    Quiz.ans[Quiz.i]=cur;
    renderQ();
  } else {
    if(Quiz.opt.instant && cur.length && cur[0]!==-1) return; // 已判分不可改
    Quiz.ans[Quiz.i]=[oi];
    if(Quiz.opt.instant){
      Quiz.judged=Quiz.judged||{}; Quiz.judged[Quiz.i]=true;
      var right = q.ans[0]===oi;
      recAnswer(q, right); recordRound(right); beep(right); buzz(right);
      afterJudge(right);
    }
    renderQ();
  }
}
function judgeMulti(){
  var q=curQ();
  var a=Quiz.ans[Quiz.i]||[];
  if(!a.length) return;
  Quiz.judged=Quiz.judged||{}; Quiz.judged[Quiz.i]=true;
  var right=sameSet(a,q.ans);
  recAnswer(q,right); recordRound(right); beep(right); buzz(right);
  afterJudge(right);
  renderQ();
}
function afterJudge(right){
  if(!Quiz||Quiz.mode!=='loop') return;
  var qi=Quiz.i;
  Quiz.needMap=Quiz.needMap||{};
  // 先把该题从队列摘出(答完的题不留在队列), 进度存needMap
  for(var k=0;k<Quiz.loopQ.length;k++){ if(Quiz.loopQ[k].idx===qi){ Quiz.loopQ.splice(k,1); break; } }
  var need = Quiz.needMap[qi];
  if(need===undefined) need=Quiz.loopStreak;  // 首次作答
  if(right){
    need--;
    if(need<=0){
      Quiz.graduated=(Quiz.graduated||0)+1;  // 连对K次: 毕业移出循环题库
      delete Quiz.needMap[qi];
      return;
    }
    Quiz.needMap[qi]=need;
    Quiz.loopQ.push({idx:qi, dueIn:2+Math.floor(Math.random()*19)});
  } else {
    Quiz.needMap[qi]=Quiz.loopStreak;  // 答错: 连对归零
    Quiz.loopQ.push({idx:qi, dueIn:2+Math.floor(Math.random()*19)});
  }
}
function recordRound(right){ if(right) Quiz.right++; else Quiz.wrongn++; }

function loopTick(){
  // 每答完一题: 队列倒计时-1, 到0的题生成重现任务
  if(!Quiz||Quiz.mode!=='loop') return null;
  var due=null;
  Quiz.loopQ.forEach(function(e){ e.dueIn--; });
  for(var k=0;k<Quiz.loopQ.length;k++){
    if(Quiz.loopQ[k].dueIn<=0){ due=Quiz.loopQ[k].idx; Quiz.loopQ.splice(k,1); break; }
  }
  return due;
}
function nextQ(){
  clearTimeout(autoT);
  if(!Quiz||Quiz.done) return;
  // 未提交答案不允许下一题: 已选择但未判定(且非背题)
  var cur=Quiz.ans[Quiz.i]||[];
  var hasPick=cur.length&&cur[0]!==-1;
  var isJudged=Quiz.judged&&Quiz.judged[Quiz.i];
  if(hasPick&&!isJudged&&!Quiz.opt.recite){
    document.getElementById('qFb').className='feedback show bad';
    document.getElementById('qFb').textContent='请先提交答案（点击确认）';
    return;
  }
  if(!hasPick&&!isJudged&&!Quiz.opt.recite){
    document.getElementById('qFb').className='feedback show bad';
    document.getElementById('qFb').textContent='请先作答本题';
    return;
  }
  if(Quiz.mode==='loop'){
    Quiz.rounds++;
    var due=loopTick();
    if(Quiz.linIdx===undefined) Quiz.linIdx=0;
    // 优先: 到期重现题
    if(due!==null && due!==undefined){
      Quiz.i=due;
      delete Quiz.ans[due]; delete Quiz.judged[due];
      renderQ(); return;
    }
    // 线性前进
    if(Quiz.linIdx<Quiz.qs.length-1){ Quiz.linIdx++; Quiz.i=Quiz.linIdx; renderQ(); return; }
    // 线性走完: 只消化循环队列
    if(Quiz.loopQ.length){
      var minE=null;
      Quiz.loopQ.forEach(function(e){ if(!minE||e.dueIn<minE.dueIn) minE=e; });
      Quiz.rounds+=minE.dueIn;
      Quiz.loopQ.forEach(function(e){ e.dueIn-=minE.dueIn; });
      Quiz.i=minE.idx;
      Quiz.loopQ.splice(Quiz.loopQ.indexOf(minE),1);
      delete Quiz.ans[Quiz.i]; delete Quiz.judged[Quiz.i];
      renderQ(); return;
    }
    finishQuiz(); return;
  }
  if(Quiz.i<Quiz.qs.length-1){ Quiz.i++; renderQ(); }
  else finishQuiz();
}
function prevQ(){ if(Quiz&&Quiz.i>0){ clearTimeout(autoT); Quiz.i--; renderQ(); } }

function finishQuiz(){
  try{ localStorage.removeItem('quizSession'); localStorage.removeItem('lastView'); }catch(e){}
  if(!Quiz) return;
  Quiz.done=true; stopTimer(); clearTimeout(autoT);
  show('vResult');
  var tot=Quiz.right+Quiz.wrongn;
  var pct= tot? Math.round(Quiz.right/tot*100):0;
  document.getElementById('rPct').textContent=pct+'%';
  var arc=document.getElementById('ringArc');
  arc.style.transition='stroke-dashoffset .8s ease';
  arc.style.strokeDashoffset= 326.7*(1-pct/100);
  arc.setAttribute('stroke', pct>=80?'var(--ok)':pct>=60?'var(--ac)':'var(--bad)');
  document.getElementById('rSub').textContent=(MODE_TITLE[Quiz.mode]||'练习')+' · 共 '+tot+' 题'+(Quiz.mode==='loop'?' · '+Quiz.rounds+' 轮':'');
  var sg=document.getElementById('rStats');
  sg.innerHTML = statCells([
    [Quiz.right,'答对'],[Quiz.wrongn,'答错'],[fmtPct(Quiz.right,tot),'正确率'],
    Quiz.mode==='loop'? [(Quiz.graduated||0)+'/'+Quiz.qs.length,'已毕业'] : [Quiz.qs.length,'总题数']
  ]);
  if(Quiz.opt.loop && Quiz.wrongn>0){
    // 循环模式: 错题重入队列尾部
    var wrongIdx=[];
    Quiz.qs.forEach(function(q,i){ if(Quiz.ans[i]&&sameSet(Quiz.ans[i],[-1])|| (Quiz.ans[i]&&!sameSet(Quiz.ans[i],q.ans))) wrongIdx.push(i); });
  }
}
function statCells(arr){ return arr.map(function(p){ return '<div class="stat"><b>'+p[0]+'</b><span>'+p[1]+'</span></div>'; }).join(''); }

function renderAnsSheet(){
  if(!Quiz) return;
  show('vAnsSheet');
  var g=document.getElementById('ansGrid'), html='';
  Quiz.qs.forEach(function(q,i){
    var a=Quiz.ans[i], cls='acell';

    if(i===Quiz.i) cls+=' cur';
    html+='<button class="'+cls+'" data-i="'+i+'">'+(i+1)+'</button>';
  });
  g.innerHTML=html;
}

var confTime=10, confGap='rand', confStreak=3;
function confPool(){
  var pool=[];
  BANK.forEach(function(q,i){
    if(confSel.sec[q.sec] && confSel.type[q.type]) pool.push(i);
  });
  return pool;
}
function startConf(){
  var spec=MODE_CONF[confMode];
  var pool=confPool();
  if(!pool.length){ alert('请至少选择一个章节和题型'); return; }
  var list=pool;
  if(confMode==='forget'){
    // 遗忘曲线: 优先错题 + 答对次数少的题
    var scored = list.map(function(idx){
      var st=S.stats[idx]||{r:0,w:0};
      var score = st.w*10 - st.r + (S.wrong.indexOf(idx)>=0? 100:0);
      return [idx, score];
    }).filter(function(x){ return x[1]>0; });
    scored.sort(function(a,b){ return b[1]-a[1]; });
    if(scored.length){
      list = scored.slice(0,50).map(function(x){ return x[0]; });
      if(S.qshuf) list=shuffle(list);
    }
    // 无历史时退化为普通顺序
  }
  if(spec.types.indexOf('range')>=0){
    var f=parseInt(document.getElementById('confFrom').value)||1;
    var t=parseInt(document.getElementById('confTo').value)||pool.length;
    if(f>t){ var tmp=f;f=t;t=tmp; }
    list=pool.slice(f-1,t);
  }
  if(S.qshuf && confMode!=='seq') list=shuffle(list);
  else if(S.qshuf && confMode==='seq') list=shuffle(list);
  if(spec.types.indexOf('count')>=0){
    var n=parseInt(document.getElementById('confCount').value);
    if(n>0 && n<list.length) list=list.slice(0,n);
  }
  var opt={mode:confMode, instant:S.instant, auto:S.auto, timer:0, recite:confMode==='recite', loop:confMode==='loop', gap:confGap, streak:confStreak};
  if(confMode==='quick') opt.timer=confTime;
  if(confMode==='recite') opt.instant=false;
  // 乱选项: 预生成每个题的选项映射
  if(S.oshuf){
    list.forEach(function(idx){ var q=BANK[idx]; if(q.type!=='判断题'&&q.opts.length>1){ q.__order=shuffle(q.opts.map(function(_,i){return i;})); } });
  }
  buildQuiz(list, opt);
  renderQ();
}
function setSw(id,on){ var el=document.getElementById(id); if(el) el.classList.toggle('on',!!on); }
function bindSw(id,key,cb){
